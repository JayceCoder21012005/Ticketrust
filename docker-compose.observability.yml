# Spec 17 observability for the VPS (and the load-test stack): OTLP from api and worker -> OpenTelemetry Collector ->
# Prometheus (metrics) + Tempo (traces) -> Grafana with the "Flash sale" dashboard and its alerts, all provisioned from files.
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml --env-file .env up -d
# Every port binds to 127.0.0.1 only: reach Grafana through an SSH tunnel (ssh -L 3001:127.0.0.1:3001 vps), never the internet.
# GRAFANA_ADMIN_PASSWORD (in .env) is the admin password of the first start.
services:
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: api
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: worker

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    depends_on: [tempo]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus, tempo]

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
