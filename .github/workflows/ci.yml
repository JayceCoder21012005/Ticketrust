name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TicketRush.slnx
      - name: Build (warnings are errors)
        run: dotnet build TicketRush.slnx -c Release --no-restore
      - name: Unit tests
        run: |
          dotnet test --project tests/TicketRush.Domain.Tests -c Release --no-build
          dotnet test --project tests/TicketRush.Application.Tests -c Release --no-build
          dotnet test --project tests/TicketRush.ArchitectureTests -c Release --no-build
      - name: Integration tests (Testcontainers)
        run: dotnet test --project tests/TicketRush.Api.IntegrationTests -c Release --no-build
      - name: Vulnerable packages
        run: |
          dotnet list TicketRush.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -E "\b(High|Critical)\b" vulnerable.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: src/TicketRush.Api/Dockerfile }
          - { name: worker, context: ., file: src/TicketRush.Worker/Dockerfile }
          - { name: migrations, context: ., file: src/TicketRush.MigrationService/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
