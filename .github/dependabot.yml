version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      aspire: { patterns: ["Aspire.*", "CommunityToolkit.Aspire.*"] }
      opentelemetry: { patterns: ["OpenTelemetry.*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    # One PR for minor/patch bumps: separate PRs all touch package-lock.json and conflict with each other.
    groups:
      web-minor-patch: { update-types: ["minor", "patch"] }
    ignore:
      # `typescript` is an alias for @typescript/typescript6 (the API typescript-eslint and Next import);
      # TS 7 itself is `@typescript/native`. Drop the alias when typescript-eslint supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
