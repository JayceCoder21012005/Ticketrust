# Single-VPS production stack. Secrets come from .env (see .env.example), never from git.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
name: ticketrush

x-dotnet-env: &dotnet-env
  ConnectionStrings__ticketrush: Host=postgres;Database=ticketrush;Username=ticketrush;Password=${POSTGRES_PASSWORD}
  ConnectionStrings__redis: redis:6379,password=${REDIS_PASSWORD}
  Redis__Environment: prod
  Jwt__SigningKey: ${JWT_SIGNING_KEY}
  Catalog__AccessCodePepper: ${ACCESS_CODE_PEPPER:?set ACCESS_CODE_PEPPER}
  Email__FromAddress: ${EMAIL_FROM_ADDRESS}
  Storage__PublicBaseUrl: https://${PUBLIC_HOST}/media
  Frontend__BaseUrl: https://${PUBLIC_HOST}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot: applies migrations (never seeds) before api/worker start.
  migrations:
    image: ${REGISTRY:-ghcr.io/ticketrush}/migrations:${TAG:-latest}
    build: { context: ., dockerfile: src/TicketRush.MigrationService/Dockerfile }
    environment:
      ConnectionStrings__ticketrush: Host=postgres;Database=ticketrush;Username=ticketrush;Password=${POSTGRES_PASSWORD}
      Migrations__SeedDevData: "false"
      Catalog__AccessCodePepper: ${ACCESS_CODE_PEPPER:?set ACCESS_CODE_PEPPER}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ${REGISTRY:-ghcr.io/ticketrush}/api:${TAG:-latest}
    build: { context: ., dockerfile: src/TicketRush.Api/Dockerfile }
    restart: unless-stopped
    environment: *dotnet-env
    depends_on:
      redis: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }

  worker:
    image: ${REGISTRY:-ghcr.io/ticketrush}/worker:${TAG:-latest}
    build: { context: ., dockerfile: src/TicketRush.Worker/Dockerfile }
    restart: unless-stopped
    environment:
      <<: *dotnet-env
      # Refreshes the web's ISR pages after publish / cancel / edit (spec 05), over the internal network.
      Frontend__RevalidateUrl: http://web:3000/api/revalidate
      Frontend__RevalidateSecret: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
    depends_on:
      redis: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }

  web:
    image: ${REGISTRY:-ghcr.io/ticketrush}/web:${TAG:-latest}
    build: { context: web, args: { API_URL: "http://api:8080" } }
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      # Shared with the worker: it calls POST /api/revalidate after event changes (spec 05).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
    depends_on: [api]

  # TLS termination + HSTS. Only the web origin is public; /api is proxied by Next.js.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

volumes:
  postgres-data:
  redis-data:
  caddy-data:
